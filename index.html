<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OLO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c3aed'/%3E%3Cpath d='M32 12 L48 32 L32 52 L16 32 Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%237c3aed'/%3E%3Cpath d='M32 12 L48 32 L32 52 L16 32 Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='white'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0f0f12; --surface:#1a1a20; --border:#2a2a33;
  --fg:#e8e8ec; --dim:#8a8a96; --accent:#a78bfa; --accent2:#7c3aed;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--fg);
  min-height:100vh; padding:16px;
  max-width:520px; margin:0 auto;
  display:flex; flex-direction:column; justify-content:center;
}
@media (min-width:768px){
  body{ justify-content:center; padding-top:33vh; }
}
textarea{
  width:100%; min-height:140px; resize:vertical;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  color:var(--fg); font-size:14px; padding:12px; line-height:1.5;
  outline:none; transition:border-color .2s;
}
textarea:focus{border-color:var(--accent2)}
.row{display:flex; gap:8px; margin-top:10px}
button{
  flex:1; padding:11px 0; border:none; border-radius:10px;
  font-size:14px; font-weight:600; cursor:pointer;
  background:var(--surface); color:var(--fg); border:1px solid var(--border);
  transition:opacity .15s;
}
button:active{opacity:.7}
button.primary{background:linear-gradient(135deg,var(--accent2),var(--accent)); border:none; color:#fff}
#links{margin-top:12px}
.link-card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:13px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px;
  cursor:pointer; transition:border-color .15s, transform .1s;
}
.link-card:active{transform:scale(.98); border-color:var(--accent)}
.link-card .txt{flex:1; min-width:0}
.link-card .name{
  font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; margin-bottom:2px;
}
.link-card .path{font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.link-card .arrow{color:var(--dim); font-size:16px}
#status{
  margin-top:10px; text-align:center; font-size:13px; color:var(--dim);
  min-height:20px;
}
#status.ok{color:#4ade80}
#status.err{color:#f87171}
.empty{color:var(--dim); font-size:13px; text-align:center; padding:24px 0}
</style>
</head>
<body>
<textarea id="input" placeholder="粘贴文本…"></textarea>

<div class="row">
  <button class="primary" onclick="pasteAndGo()">📋 粘贴并提取</button>
  <button onclick="clearAll()">清空</button>
</div>

<div id="status"></div>
<div id="links"><div class="empty"></div></div>

<script>
const DEFAULT_VAULT = 'notes';

function extractObsidianUris(text){
  const uris = [];
  const re = /obsidian:\/\/[^\s<>"')\]]+/g;
  let m;
  while((m = re.exec(text)) !== null){
    uris.push({uri: m[0], kind: 'uri'});
  }
  return uris;
}

function extractWikiLinks(text){
  const links = [];
  const re = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;
  let m;
  while((m = re.exec(text)) !== null){
    const target = m[1].trim();
    if(target.startsWith('obsidian://')) continue;
    links.push({target: target.replace(/\.md$/,''), alias: m[2] ? m[2].trim() : null, kind: 'wiki'});
  }
  return links;
}

function decodeFileFromUri(uri){
  try{
    const u = new URL(uri);
    const file = u.searchParams.get('file');
    if(file) return decodeURIComponent(file);
    if(u.hash) return decodeURIComponent(u.hash.slice(1));
  }catch(e){}
  return null;
}

function prettyName(item){
  if(item.kind === 'uri'){
    const f = decodeFileFromUri(item.uri);
    if(f) return f.split('/').pop().replace(/\.md$/,'');
    return item.uri.slice(0, 40) + '…';
  }
  return item.alias || item.target.split('/').pop();
}

function prettyPath(item){
  if(item.kind === 'uri'){
    const f = decodeFileFromUri(item.uri);
    return f ? f : item.uri;
  }
  return item.target;
}

function wikiToUri(item){
  return 'obsidian://open?vault=' + encodeURIComponent(DEFAULT_VAULT) + '&file=' + encodeURIComponent(item.target);
}

function render(items){
  const box = document.getElementById('links');
  if(!items.length){
    box.innerHTML = '<div class="empty"></div>';
    return;
  }
  box.innerHTML = '';
  items.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'link-card';
    card.innerHTML = '<div class="txt"><div class="name"></div><div class="path"></div></div><div class="arrow">→</div>';
    card.querySelector('.name').textContent = prettyName(item);
    card.querySelector('.path').textContent = prettyPath(item);
    card.onclick = () => {
      window.location.href = item.kind === 'uri' ? item.uri : wikiToUri(item);
    };
    box.appendChild(card);
  });
}

function extract(){
  const text = document.getElementById('input').value;
  const status = document.getElementById('status');
  if(!text.trim()){ status.textContent = ''; status.className=''; return; }
  const uris = extractObsidianUris(text);
  const wikis = extractWikiLinks(text);
  const seen = new Set(uris.map(u=>u.uri));
  const wikisDedup = wikis.filter(w=>{
    if(seen.has(w.target)) return false;
    seen.add(w.target); return true;
  });
  const items = [...uris, ...wikisDedup];
  render(items);
  if(items.length){
    status.textContent = items.length + ' 个链接';
    status.className = 'ok';
  } else {
    status.textContent = '未找到 Obsidian 链接';
    status.className = 'err';
  }
}

async function pasteAndGo(){
  try{
    const text = await navigator.clipboard.readText();
    document.getElementById('input').value = text;
    extract();
  }catch(e){
    const status = document.getElementById('status');
    status.textContent = '剪贴板不可用，请手动粘贴';
    status.className = 'err';
  }
}

function clearAll(){
  document.getElementById('input').value = '';
  document.getElementById('links').innerHTML = '<div class="empty"></div>';
  const status = document.getElementById('status');
  status.textContent = ''; status.className = '';
}

window.addEventListener('DOMContentLoaded', () => {
  const u = new URLSearchParams(location.search).get('u');
  if(u && u.startsWith('obsidian://')){
    location.href = u;
  }
});
</script>
</body>
</html>
